name: Build RestaurantOS Windows Installer

on:
  push:
    branches: [ main, master, gpt-harness ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows Installer
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v22 Active LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: false
          cache: 'npm'
          
      - name: Clear npm Cache
        run: npm cache clean --force
        
      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Rebuild Native Modules
        run: npm rebuild 

      - name: Dynamic Windows Native Dependency Audit & Verification
        run: node scripts/audit-windows-native-deps.cjs

      - name: Validate TypeScript Types & Code Quality
        run: npm run lint

      - name: Run Reliability Regression Checks
        run: |
          node scripts/verify-reliability-hardening.cjs
          npx tsx scripts/verify-command-idempotency.ts

      - name: Run Localization & Licensing Verification Suites
        run: |
          node scripts/audit-translations-and-ux.cjs
          node scripts/verify-offline-licensing.cjs
          npx tsx scripts/verify-setup-licensing-flow.cjs

      - name: Download Visual C++ 2015-2022 Redistributable Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "windows\redist" | Out-Null
          if (-not (Test-Path "windows\redist\VC_redist.x64.exe")) {
            Write-Host "Downloading VC_redist.x64.exe from Microsoft..."
            try {
              Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "windows\redist\VC_redist.x64.exe" -TimeoutSec 90
              Write-Host "VC_redist.x64.exe downloaded successfully."
            } catch {
              Write-Warning "Failed to download VC_redist.x64.exe ($($_.Exception.Message)). Packaging will continue using pre-bundled MSVC runtime DLLs."
            }
          }

      - name: Compile Native Windows Launcher (RestaurantOS.exe)
        shell: pwsh
        run: |
          # Dynamically search for C# compiler csc.exe across Visual Studio and .NET installations
          $csc = $null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vsPath = & $vswhere -latest -property installationPath
            if ($vsPath) {
              $roslyn = Join-Path $vsPath "MSBuild\Current\Bin\Roslyn\csc.exe"
              if (Test-Path $roslyn) {
                $csc = $roslyn
              }
            }
          }

          if (-not $csc) {
            $cscCandidates = @(
              "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\Roslyn\csc.exe",
              "C:\Program Files\Microsoft Visual Studio\2022\Professional\MSBuild\Current\Bin\Roslyn\csc.exe",
              "C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\Roslyn\csc.exe",
              "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\Roslyn\csc.exe",
              "C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise\MSBuild\Current\Bin\Roslyn\csc.exe",
              "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe",
              "C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe"
            )
            foreach ($p in $cscCandidates) {
              if (Test-Path $p) {
                $csc = $p
                break
              }
            }
          }

          if (-not $csc) {
            $cmd = Get-Command csc.exe -ErrorAction SilentlyContinue
            if ($cmd) { $csc = $cmd.Source }
          }
          if (-not $csc) {
            Write-Error "Could not locate C# compiler (csc.exe) on Windows runner!"
            exit 1
          }
          Write-Host "Compiling native Windows launcher with $csc..."
          & $csc /target:winexe /optimize+ /platform:anycpu /r:System.dll /r:System.Windows.Forms.dll /r:System.Drawing.dll /win32icon:"public\favicon.ico" /out:"windows\launcher\RestaurantOS.exe" "windows\launcher\RestaurantOS.cs"
          if (-not (Test-Path "windows\launcher\RestaurantOS.exe")) {
            Write-Error "RestaurantOS.exe was not created!"
            exit 1
          }
          $exeBytes = (Get-Item "windows\launcher\RestaurantOS.exe").Length
          Write-Host "Successfully compiled native RestaurantOS.exe ($exeBytes bytes)."

      - name: Build Production Bundles & Standalone Windows Package
        run: npm run package:windows

      - name: Run Windows Deployment & Self-Contained Runtime Verification
        run: npm run verify:windows

      - name: Install Inno Setup Compiler
        run: |
          choco install innosetup --no-progress

      - name: Compile Windows Installer Executable
        shell: pwsh
        run: |
          # Dynamically locate ISCC.exe across PATH and standard installation directories
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $possiblePaths = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe"
            )
            foreach ($p in $possiblePaths) {
              if (Test-Path $p) {
                $iscc = $p
                break
              }
            }
          } else {
            $iscc = $iscc.Source
          }

          if (-not $iscc -or -not (Test-Path $iscc)) {
            Write-Error "Could not locate Inno Setup compiler (ISCC.exe)!"
            exit 1
          }

          Write-Host "Compiling installer using Inno Setup compiler at: $iscc"
          & $iscc windows\installer\RestaurantOS-Setup.iss

      - name: Verify Installer Artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "dist\installer" -Filter "RestaurantOS-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) {
            Write-Error "Installer EXE was not generated in dist/installer!"
            exit 1
          }
          Write-Host "Generated installer artifact: $($installer.FullName) (Size: $([math]::Round($installer.Length / 1MB, 2)) MB)"

      - name: Publish Windows Installer to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref_type == 'tag'
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'RestaurantOS Release v1.0.0' }}
          draft: false
          prerelease: false
          files: dist/installer/RestaurantOS-Setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Installer (.EXE) Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: RestaurantOS-Setup-Installer
          path: dist/installer/RestaurantOS-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
